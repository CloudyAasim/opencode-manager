name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
    types: [labeled]
  pull_request_review:
    types: [submitted]

jobs:
  check-ready:
    name: Check if Ready for CI
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.check.outputs.run }}
    steps:
      - name: Check trigger conditions
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "Triggered by push to main"
            echo "run=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "pull_request_review" && "${{ github.event.review.state }}" == "approved" ]]; then
            echo "Triggered by PR approval"
            echo "run=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.label.name }}" == "ready-for-ci" ]]; then
            echo "Triggered by ready-for-ci label"
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "Conditions not met, skipping CI"
            echo "run=false" >> $GITHUB_OUTPUT
          fi

  lint:
    name: Lint
    needs: check-ready
    if: needs.check-ready.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

  typecheck:
    name: Type Check
    needs: check-ready
    if: needs.check-ready.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type check
        run: pnpm typecheck

  test:
    name: Test
    needs: check-ready
    if: needs.check-ready.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the pinned OpenCode binary
        run: |
          set -euo pipefail
          # The plugin end-to-end test only runs against a real OpenCode, and it
          # skips silently when there is none - which is how a plugin that has
          # stopped loading ships behind a green build. The version is read out
          # of the Dockerfile so it stays pinned in exactly one place.
          VERSION="$(grep -oP '(?<=^ARG OPENCODE_VERSION=).*' Dockerfile)"
          BASE="$(grep -oP '(?<=^ARG OPENCODE_DOWNLOAD_BASE=).*' Dockerfile)"
          if [ -z "$VERSION" ] || [ -z "$BASE" ]; then
            echo "Could not read OPENCODE_VERSION / OPENCODE_DOWNLOAD_BASE from the Dockerfile" >&2
            exit 1
          fi
          case "$(uname -m)" in
            x86_64) ARCH=x64 ;;
            aarch64 | arm64) ARCH=arm64 ;;
            *) echo "Unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          URL="$BASE/download/v$VERSION/opencode-linux-$ARCH.tar.gz"
          echo "Installing opencode $VERSION from $URL"
          BIN_DIR="$HOME/opencode-bin"
          mkdir -p "$BIN_DIR"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 \
            --connect-timeout 20 --max-time 600 "$URL" -o /tmp/opencode.tar.gz
          tar -xzf /tmp/opencode.tar.gz -C /tmp
          mv /tmp/opencode "$BIN_DIR/opencode"
          chmod 755 "$BIN_DIR/opencode"
          rm -f /tmp/opencode.tar.gz
          # The test accepts a candidate only when `--version` exits 0 and
          # prints something, so prove both here rather than letting the test
          # quietly skip.
          "$BIN_DIR/opencode" --version
          "$BIN_DIR/opencode" --version | grep -q "$VERSION" || {
            echo "Installed binary does not report version $VERSION" >&2
            exit 1
          }
          echo "OPENCODE_BIN=$BIN_DIR/opencode" >> "$GITHUB_ENV"
          echo "OCM_REQUIRE_OPENCODE_BIN=1" >> "$GITHUB_ENV"

      - name: Run tests
        run: pnpm test
        env:
          # The end-to-end test spawns the real binary. Keep it off the network
          # and out of the update path so neither can turn into a red build.
          OPENCODE_DISABLE_AUTOUPDATE: "1"
          DO_NOT_TRACK: "1"

  desktop-client:
    name: Desktop Client
    needs: check-ready
    if: needs.check-ready.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Deliberately npm, not pnpm, and deliberately --ignore-scripts.
      #
      # electron-app is not a workspace member: adding it would put electron's
      # 266 MB binary into the lockfile, so every server CI run and every Docker
      # build would download a desktop runtime the server never loads.
      #
      # The tests never need that binary - vitest aliases `electron` to a stub,
      # because what is under test is this app's wiring (does the proxy start,
      # is the window pointed at it, are the guards attached), not electron's.
      # So the binary is skipped and the job costs about a second.
      - name: Install without the Electron binary
        working-directory: electron-app
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Confirm the binary really is absent
        working-directory: electron-app
        run: |
          if [ -e node_modules/electron/dist/electron ]; then
            echo "the Electron binary was downloaded; the tests will silently"
            echo "depend on it and stop proving anything about a clean checkout"
            exit 1
          fi
          echo "ok - no Electron binary, so these are the tests CI can run"

      - name: Type check
        working-directory: electron-app
        run: npm run typecheck

      - name: Run tests
        working-directory: electron-app
        run: npm test

      - name: Build the bundle
        working-directory: electron-app
        # The build script also stages the built frontend, which does not exist
        # in a clean checkout. Proving the bundle itself still compiles is worth
        # more than asserting on a file that is not there yet.
        run: node scripts/build.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-main-bundle
          path: electron-app/dist/main.js
          retention-days: 7
