name: dokku-diagnostics

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe OpenCode inside the app image
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEBAINDOKKU001 }}
          SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}
        run: |
          set -uo pipefail
          HOST=SERVER_HOST
          APP=opencode-manager
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_HOST_KEY" | tr -d '\r' > ~/.ssh/known_hosts
          dokku() { ssh -i ~/.ssh/id_deploy -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes -o LogLevel=ERROR -o ConnectTimeout=15 "dokku@$HOST" "$@"; }
          section() { echo; echo "########## $* ##########"; }

          section "opencode version"
          dokku run "$APP" opencode --version 2>&1 | tail -5 || true

          section "opencode serve --help"
          dokku run "$APP" opencode serve --help 2>&1 | tail -40 || true

          section "manual opencode serve (20s)"
          dokku run "$APP" sh -c 'timeout 20 opencode serve --port 5559 --hostname 127.0.0.1 2>&1 | head -60' 2>&1 | tail -60 || true

          section "recent opencode-tagged app logs"
          dokku logs "$APP" --num 1500 2>&1 | grep -aiE "opencode|error|stderr|EADDR|panic|throw" | grep -aivE "Proxy request failed|at async|Unable to connect|health-watch" | tail -80 || true

          section "health"
          dokku run "$APP" sh -c 'curl -sS -m 5 http://127.0.0.1:5551/global/health 2>&1 | head -c 400' 2>&1 | tail -5 || true
