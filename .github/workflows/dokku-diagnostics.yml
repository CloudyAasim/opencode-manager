name: dokku-diagnostics

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Check user-namespace support inside the app container
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEBAINDOKKU001 }}
          SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}
        run: |
          set -uo pipefail
          HOST=SERVER_HOST
          APP=opencode-manager
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_HOST_KEY" | tr -d '\r' > ~/.ssh/known_hosts
          dokku() { ssh -i ~/.ssh/id_deploy -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes -o LogLevel=ERROR -o ConnectTimeout=15 "dokku@$HOST" "$@"; }

          echo "########## id ##########"
          dokku run "$APP" id || true
          echo "########## unprivileged_userns_clone ##########"
          dokku run "$APP" cat /proc/sys/kernel/unprivileged_userns_clone || true
          echo "########## max_user_namespaces ##########"
          dokku run "$APP" cat /proc/sys/user/max_user_namespaces || true
          echo "########## unshare -Ur true (exit) ##########"
          dokku run "$APP" unshare -Ur true; echo "userns_exit=$? (continuing)"
          echo "########## unshare -Urm --propagation unchanged (exit) ##########"
          dokku run "$APP" unshare -Urm --propagation unchanged true || echo "unshare_unchanged_failed=$?"
          echo "########## root mount propagation ##########"
          dokku run "$APP" grep -w / /proc/self/mountinfo || true
          echo "########## outer userns: bind ro ##########"
          dokku run "$APP" unshare --user --map-root-user --mount --propagation unchanged mount --bind -o ro /usr /mnt || echo "userns_bind_ro_failed=$?"
          echo "########## outer userns: rbind /dev ##########"
          dokku run "$APP" unshare --user --map-root-user --mount --propagation unchanged mount --rbind /dev /mnt || echo "userns_rbind_dev_failed=$?"
          echo "########## outer userns: rbind /proc ##########"
          dokku run "$APP" unshare --user --map-root-user --mount --propagation unchanged mount --rbind /proc /mnt || echo "userns_rbind_proc_failed=$?"
          echo "########## outer userns: chroot ##########"
          dokku run "$APP" unshare --user --map-root-user --mount --propagation unchanged chroot / /bin/true || echo "userns_chroot_failed=$?"
