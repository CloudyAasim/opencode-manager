name: dokku-diagnostics

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Check user-namespace support inside the app container
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEBAINDOKKU001 }}
          SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}
        run: |
          set -uo pipefail
          HOST=SERVER_HOST
          APP=opencode-manager
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_HOST_KEY" | tr -d '\r' > ~/.ssh/known_hosts
          dokku() { ssh -i ~/.ssh/id_deploy -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes -o LogLevel=ERROR -o ConnectTimeout=15 "dokku@$HOST" "$@"; }

          echo "########## id ##########"
          dokku run "$APP" id || true
          echo "########## unprivileged_userns_clone ##########"
          dokku run "$APP" cat /proc/sys/kernel/unprivileged_userns_clone || true
          echo "########## max_user_namespaces ##########"
          dokku run "$APP" cat /proc/sys/user/max_user_namespaces || true
          echo "########## unshare -Ur true (exit) ##########"
          dokku run "$APP" unshare -Ur true; echo "userns_exit=$? (continuing)"
          echo "########## unshare -Urm --propagation unchanged (exit) ##########"
          dokku run "$APP" unshare -Urm --propagation unchanged true || echo "unshare_unchanged_failed=$?"
          echo "########## root mount propagation ##########"
          dokku run "$APP" grep -w / /proc/self/mountinfo || true
          echo "########## sandbox: id ##########"
          dokku run "$APP" unshare --user --map-root-user --mount --propagation unchanged -- /bin/sh /app/backend/scripts/terminal-sandbox.sh /usr/bin/id /workspace || echo "sandbox_id_failed=$?"
          echo "########## sandbox: ls / ##########"
          dokku run "$APP" unshare --user --map-root-user --mount --propagation unchanged -- /bin/sh /app/backend/scripts/terminal-sandbox.sh /bin/ls /workspace / || echo "sandbox_ls_failed=$?"
          echo "########## sandbox: /app must be unreachable ##########"
          dokku run "$APP" unshare --user --map-root-user --mount --propagation unchanged -- /bin/sh /app/backend/scripts/terminal-sandbox.sh /bin/ls /workspace /app && echo "sandbox_app_visible=BAD" || echo "sandbox_app_hidden=OK"
          echo "########## sandbox: workspace writable ##########"
          dokku run "$APP" unshare --user --map-root-user --mount --propagation unchanged -- /bin/sh /app/backend/scripts/terminal-sandbox.sh /usr/bin/touch /workspace /workspace/.ocm-sandbox-probe && echo "sandbox_workspace_write=OK" || echo "sandbox_workspace_write=FAIL"
          echo "########## sandbox: /usr read-only ##########"
          dokku run "$APP" unshare --user --map-root-user --mount --propagation unchanged -- /bin/sh /app/backend/scripts/terminal-sandbox.sh /usr/bin/touch /workspace /usr/.ocm-probe && echo "sandbox_usr_write=BAD" || echo "sandbox_usr_write=OK"
          echo "########## sandbox: toolchain present ##########"
          dokku run "$APP" unshare --user --map-root-user --mount --propagation unchanged -- /bin/sh /app/backend/scripts/terminal-sandbox.sh /bin/ls /workspace /usr/local/bin /opt || echo "sandbox_tools_failed=$?"
          echo "########## sandbox: git --version ##########"
          dokku run "$APP" unshare --user --map-root-user --mount --propagation unchanged -- /bin/sh /app/backend/scripts/terminal-sandbox.sh /usr/bin/git /workspace --version || echo "sandbox_git_failed=$?"
          echo "########## sandbox: node --version ##########"
          dokku run "$APP" unshare --user --map-root-user --mount --propagation unchanged -- /bin/sh /app/backend/scripts/terminal-sandbox.sh /usr/local/bin/node /workspace --version || echo "sandbox_node_failed=$?"
          echo "########## sandbox: bun --version ##########"
          dokku run "$APP" unshare --user --map-root-user --mount --propagation unchanged -- /bin/sh /app/backend/scripts/terminal-sandbox.sh /usr/local/bin/bun /workspace --version || echo "sandbox_bun_failed=$?"
          echo "########## sandbox: opencode --version ##########"
          dokku run "$APP" unshare --user --map-root-user --mount --propagation unchanged -- /bin/sh /app/backend/scripts/terminal-sandbox.sh /usr/local/bin/opencode /workspace --version || echo "sandbox_opencode_failed=$?"
          echo "########## cleanup probe file ##########"
          dokku run "$APP" rm -f /workspace/.ocm-sandbox-probe || true
