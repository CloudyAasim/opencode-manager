name: dokku-diagnostics

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Collect Dokku diagnostics
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEBAINDOKKU001 }}
          SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}
        run: |
          set -uo pipefail
          HOST=SERVER_HOST
          APP=opencode-manager
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_HOST_KEY" | tr -d '\r' > ~/.ssh/known_hosts
          dokku() { ssh -i ~/.ssh/id_deploy -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes -o LogLevel=ERROR -o ConnectTimeout=15 "dokku@$HOST" "$@"; }
          section() { echo; echo "########## $* ##########"; }

          section "ensure alternate port 8080"
          dokku ports:add "$APP" http:8080:5003 || true
          dokku ports:set "$APP" http:80:5003 http:8080:5003 || true
          dokku ports:report "$APP" || true

          APP_IP=$(dokku ps:inspect "$APP" | grep -oE '"IPAddress": *"[0-9.]+"' | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' || true)
          section "app container ip: ${APP_IP:-unknown}"

          section "direct app health (from one-off container)"
          dokku run "$APP" curl -sS -m 10 -i "http://${APP_IP}:5003/api/health" 2>&1 | head -25 || true

          section "nginx via host gateway 172.17.0.1:80 (bypasses external filtering)"
          dokku run "$APP" curl -sS -m 10 -i -H 'Host: APP_VHOST' "http://172.17.0.1/api/health" 2>&1 | head -25 || true

          section "ps:report"
          dokku ps:report "$APP" || true

      - name: HTTP probes from runner
        run: |
          set -uo pipefail
          HOST=SERVER_HOST
          for target in "http://$HOST:80/api/health" "http://$HOST:8080/api/health" "http://$HOST:8080/"; do
            echo "### $target"
            curl -sS -m 12 -i "$target" 2>&1 | head -20 || true
            echo
          done
          echo "### Host-header variant on 8080"
          curl -sS -m 12 -i -H 'Host: APP_VHOST' "http://$HOST:8080/api/health" 2>&1 | head -20 || true
          echo
          for p in 22 80 443 5003 8080; do
            if timeout 8 bash -c "cat < /dev/null > /dev/tcp/$HOST/$p" 2>/dev/null; then
              echo "tcp $p: open"
            else
              echo "tcp $p: closed/timeout"
            fi
          done
