name: dokku-diagnostics

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Collect Dokku TLS-relevant diagnostics
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEBAINDOKKU001 }}
          SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}
        run: |
          set -uo pipefail
          HOST=SERVER_HOST
          APP=opencode-manager
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_HOST_KEY" | tr -d '\r' > ~/.ssh/known_hosts
          dokku() { ssh -i ~/.ssh/id_deploy -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes -o LogLevel=ERROR -o ConnectTimeout=15 "dokku@$HOST" "$@"; }
          section() { echo; echo "########## $* ##########"; }

          section "plugin:list"; dokku plugin:list || true
          section "domains:report"; dokku domains:report "$APP" || true
          section "ports:report"; dokku ports:report "$APP" || true
          section "proxy:report"; dokku proxy:report "$APP" || true
          section "nginx:show-config"; dokku nginx:show-config "$APP" || true
          section "letsencrypt:list"; dokku letsencrypt:list || true
          section "letsencrypt:report"; dokku letsencrypt:report || true
          section "certificates"; dokku certs:report "$APP" || true

      - name: Network probes for the domain
        run: |
          set -uo pipefail
          HOST=SERVER_HOST
          DOMAIN=APP_DOMAIN
          echo "### resolve $DOMAIN"; getent hosts "$DOMAIN" || true
          echo "### http://$DOMAIN/"; curl -v -m 15 "http://$DOMAIN/" 2>&1 | tail -20 || true
          echo "### http://$DOMAIN:8080/api/health"; curl -sS -m 15 -o /dev/null -w "code=%{http_code}\n" "http://$DOMAIN:8080/api/health" || true
          echo "### https://$DOMAIN/"; curl -vk -m 15 "https://$DOMAIN/" 2>&1 | tail -20 || true
          for p in 80 443 8080; do
            if timeout 8 bash -c "cat < /dev/null > /dev/tcp/$HOST/$p" 2>/dev/null; then echo "tcp $p: open"; else echo "tcp $p: closed/timeout"; fi
          done
