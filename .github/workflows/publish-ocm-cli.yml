name: Publish ocm-cli

on:
  push:
    branches: [main]
    paths:
      - 'ocm-cli/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish @opencode-manager/ocm-cli
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read package version
        id: pkg
        working-directory: ocm-cli
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "name=${NAME}" >> $GITHUB_OUTPUT

      - name: Check publish prerequisites
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN is not set on this repository."
            echo "::error::Create an npm automation token at https://www.npmjs.com/settings/your-account/access-tokens"
            echo "::error::and add it under Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Check if version already published
        id: check
        run: |
          NAME="${{ steps.pkg.outputs.name }}"
          VERSION="${{ steps.pkg.outputs.version }}"

          LATEST=$(npm view "$NAME" dist-tags.latest 2>/dev/null || echo "")
          if [ -n "$LATEST" ]; then
            NEWER=$(node -e "
              const [a, b] = process.argv.slice(1).map(v => v.split('.').map(Number))
              console.log(a[0] > b[0] || (a[0] === b[0] && (a[1] > b[1] || (a[1] === b[1] && a[2] > b[2]))) ? 'yes' : 'no')
            " "$VERSION" "$LATEST")
            if [ "$NEWER" != "yes" ]; then
              echo "::error::$NAME in the repository is $VERSION but npm's latest is $LATEST."
              echo "::error::Publishing $VERSION would succeed and change nothing: npm's 'latest' tag"
              echo "::error::resolves to the highest version, so users would keep receiving $LATEST."
              echo "::error::Raise the version in ocm-cli/package.json above $LATEST before publishing."
              exit 1
            fi
            echo "Repository $VERSION is ahead of the published $LATEST."
          fi

          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "already_published=true" >> $GITHUB_OUTPUT
            echo "Version $VERSION already on npm; skipping publish."
          else
            echo "already_published=false" >> $GITHUB_OUTPUT
            echo "Version $VERSION not yet on npm; will publish."
          fi

      - name: Build
        if: steps.check.outputs.already_published == 'false'
        working-directory: ocm-cli
        run: bun scripts/build.ts

      - name: Publish to npm
        if: steps.check.outputs.already_published == 'false'
        working-directory: ocm-cli
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
