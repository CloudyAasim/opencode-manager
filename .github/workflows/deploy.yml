name: 'deploy'

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - 'docs/**'
      - '**/*.md'
      - 'mkdocs.yml'
      - '**/*.test.ts'
      - '**/*.test.tsx'
      - 'backend/test/**'
      - 'src-tauri/**'
  workflow_dispatch:

concurrency:
  group: deploy-opencode-manager
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Cloning repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Dokku app
        id: configure
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEBAINDOKKU001 }}
          SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}
          AUTH_SECRET: ${{ secrets.OCM_AUTH_SECRET }}
          ADMIN_EMAIL: ${{ secrets.OCM_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.OCM_ADMIN_PASSWORD }}
          DOKKU_HOST: ${{ secrets.DOKKU_HOST }}
          DOKKU_APP: ${{ secrets.DOKKU_APP }}
          DOKKU_DOMAINS: ${{ secrets.DOKKU_DOMAINS }}
        run: |
          set -euo pipefail
          HOST="$DOKKU_HOST"
          APP="$DOKKU_APP"
          # All domains this app answers on. The first one is the canonical
          # origin used for cookies, CORS and Passkey. Add extra names here when
          # the certificate covers them, or the browser will reject the request.
          read -ra DOMAINS <<< "$DOKKU_DOMAINS"
          DOMAIN="${DOMAINS[0]}"
          [ ${#DOMAINS[@]} -gt 0 ] || { echo "::error::DOKKU_DOMAINS secret is empty"; exit 1; }

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_HOST_KEY" | tr -d '\r' > ~/.ssh/known_hosts

          dokku() {
            ssh -i ~/.ssh/id_deploy \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o StrictHostKeyChecking=yes \
              -o LogLevel=ERROR \
              -o ConnectTimeout=15 \
              "dokku@$HOST" "$@"
          }

          echo "== dokku version =="
          dokku version || true

          # The Dokku host ships a docker-container-healthchecker binary that is
          # incompatible with the host glibc (GLIBC_2.32/2.34 not found). The
          # check-deploy hook runs under `set -e`, so pre-flight checks abort for
          # every app regardless of whether the app itself is healthy. Zero
          # downtime is therefore disabled for this app.
          echo "== disabling zero-downtime checks (broken host healthchecker) =="
          dokku checks:disable "$APP" || true

          echo "== allow unprivileged user namespaces for the sandboxed terminal (bwrap) =="
          dokku docker-options:add "$APP" deploy "--security-opt seccomp=unconfined" || true
          dokku docker-options:add "$APP" run "--security-opt seccomp=unconfined" || true

          echo "== configuring environment =="
          # TLS is managed manually (dokku letsencrypt). Detect it so an automated
          # deploy never downgrades origins/cookies or drops the https port map.
          SSL_ENABLED=$(dokku certs:report "$APP" --ssl-enabled 2>/dev/null | tail -1 || echo "false")
          HTTPS_ORIGINS=""
          HTTP_ORIGINS=""
          for d in "${DOMAINS[@]}"; do
            HTTPS_ORIGINS="${HTTPS_ORIGINS}${HTTPS_ORIGINS:+,}https://$d"
            HTTP_ORIGINS="${HTTP_ORIGINS}${HTTP_ORIGINS:+,}http://$d"
          done
          if [ "$SSL_ENABLED" = "true" ]; then
            DOKKU_ORIGINS="$HTTPS_ORIGINS"
            DOKKU_CORS="$HTTPS_ORIGINS"
            DOKKU_SECURE_COOKIES=true
            DOKKU_PORT_MAP="http:80:5003 https:443:5003"
            DOKKU_BASE_URL="https://$DOMAIN"
          else
            DOKKU_ORIGINS="$HTTP_ORIGINS,$HTTPS_ORIGINS"
            DOKKU_CORS="$HTTP_ORIGINS"
            DOKKU_SECURE_COOKIES=false
            DOKKU_PORT_MAP="http:80:5003"
            DOKKU_BASE_URL="http://$DOMAIN"
          fi
          echo "domains=${DOMAINS[*]}"
          echo "origins=$DOKKU_ORIGINS"

          # Output is suppressed because Dokku echoes variable values; the values
          # are sourced from GitHub secrets, which Actions masks anyway.
          dokku config:set --no-restart "$APP" \
            NODE_ENV=production \
            "AUTH_SECRET=$AUTH_SECRET" \
            "ADMIN_EMAIL=$ADMIN_EMAIL" \
            "ADMIN_PASSWORD=$ADMIN_PASSWORD" \
            AUTH_ALLOW_SIGNUP=false \
            "AUTH_SECURE_COOKIES=$DOKKU_SECURE_COOKIES" \
            AUTH_TRUST_PROXY=true \
            "AUTH_TRUSTED_ORIGINS=$DOKKU_ORIGINS" \
            "CORS_ORIGIN=$DOKKU_CORS" \
            "PASSKEY_RP_ID=$DOMAIN" \
            "PASSKEY_ORIGIN=https://$DOMAIN" \
            OCM_ALLOW_SERVER_ENV_EDIT=false \
            OCM_TERMINAL_ENABLED=true \
            OCM_TERMINAL_ADMINS_ONLY=false \
            >/dev/null

          echo "== configuring domain and port mapping =="
          for d in "${DOMAINS[@]}"; do
            dokku domains:add "$APP" "$d" || true
          done
          # Let's Encrypt cannot validate an IP or an unresolvable default vhost;
          # keep only the real domains so renewals succeed.
          # ACME cannot validate an IP or an unresolvable default vhost, so drop
          # every domain that is not on the keep list. Discovering them keeps
          # this free of any host specific value.
          for existing in $(dokku domains:report "$APP" 2>/dev/null | awk 'NR > 1 { print $2 }'); do
            keep=0
            for want in "${DOMAINS[@]}"; do
              [ "$existing" = "$want" ] && keep=1
            done
            [ "$keep" -eq 0 ] && dokku domains:remove "$APP" "$existing" || true
          done
          dokku ports:set "$APP" $DOKKU_PORT_MAP || true
          echo "base_url=$DOKKU_BASE_URL" >> "$GITHUB_OUTPUT"

          echo "== configuring persistent storage =="
          if dokku storage:ensure-directory ocm-data --chown 1000; then
            dokku storage:mount "$APP" /var/lib/dokku/data/storage/ocm-data:/app/data || true
          fi
          if dokku storage:ensure-directory ocm-workspace --chown 1000; then
            dokku storage:mount "$APP" /var/lib/dokku/data/storage/ocm-workspace:/workspace || true
          fi

          echo "== reports =="
          dokku ports:report "$APP" || true
          dokku storage:report "$APP" || true
          dokku checks:report "$APP" || true

      - name: Push to dokku
        uses: dokku/github-action@master
        with:
          git_remote_url: ${{ secrets.DOKKU_GIT_REMOTE }}
          ssh_private_key: ${{ secrets.DEBAINDOKKU001 }}
          ssh_host_key: ${{ secrets.SSH_HOST_KEY }}
          branch: main

      - name: Collect app logs and probes
        if: always()
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEBAINDOKKU001 }}
          SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}
          DOKKU_HOST: ${{ secrets.DOKKU_HOST }}
          DOKKU_APP: ${{ secrets.DOKKU_APP }}
        run: |
          set -uo pipefail
          HOST="$DOKKU_HOST"
          APP="$DOKKU_APP"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_HOST_KEY" | tr -d '\r' > ~/.ssh/known_hosts
          dokku() { ssh -i ~/.ssh/id_deploy -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes -o LogLevel=ERROR -o ConnectTimeout=15 "dokku@$HOST" "$@"; }
          echo "########## ps:report ##########"; dokku ps:report "$APP" || true
          echo "########## logs (tail 200) ##########"; dokku logs "$APP" --num 200 || true
          echo "########## probe ##########"
          BASE="${{ steps.configure.outputs.base_url }}"
          curl -v -m 15 "${BASE:-https://example.invalid}/api/health" 2>&1 | tail -15 || true

      - name: Smoke test
        env:
          ADMIN_EMAIL: ${{ secrets.OCM_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.OCM_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          BASE="${{ steps.configure.outputs.base_url }}"
          echo "base=$BASE"
          code=000
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 10 "$BASE/api/health" || true)
            echo "health attempt $i: $code"
            if [ "$code" = "200" ]; then
              break
            fi
            sleep 10
          done
          echo "--- health body ---"
          curl -s -m 10 "$BASE/api/health" || true
          echo
          echo "--- index status ---"
          curl -s -o /dev/null -w 'index=%{http_code}\n' -m 10 "$BASE/" || true
          if [ "$code" != "200" ]; then
            echo "::error::health check never returned 200 (last=$code)"
            exit 1
          fi
          echo "--- admin sign-in ---"
          signin_code=$(curl -s -m 15 -c /tmp/cookies.txt -o /tmp/signin.json -w '%{http_code}' \
            -X POST "$BASE/api/auth/sign-in/email" \
            -H 'Content-Type: application/json' \
            --data "{\"email\":\"$ADMIN_EMAIL\",\"password\":\"$ADMIN_PASSWORD\"}" || true)
          echo "signin=$signin_code"
          if [ "$signin_code" != "200" ]; then
            echo "::error::admin sign-in failed ($signin_code)"
            head -c 300 /tmp/signin.json || true
            exit 1
          fi
          echo "--- session check ---"
          session_code=$(curl -s -m 15 -b /tmp/cookies.txt -o /tmp/session.json -w '%{http_code}' "$BASE/api/auth/get-session" || true)
          echo "session=$session_code"
          if [ "$session_code" != "200" ]; then
            echo "::error::session check failed ($session_code)"
            exit 1
          fi

