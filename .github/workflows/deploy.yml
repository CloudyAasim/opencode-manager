name: Deploy to Dokku

on:
  push:
    branches:
      - main
  # Redeploy the current main without pushing a commit for the sake of it.
  #
  # `deploy/DOKKU.md` tells an operator to redeploy with
  # `gh workflow run deploy.yml`, which only works if this trigger exists -
  # and the first deploy that failed on the host needed a retry that did not
  # require inventing an empty commit to trigger one.
  workflow_dispatch:

# The action pushes the running commit to Dokku's `server` branch, so two
# deploys at once race on that ref and the loser is rejected as a
# non-fast-forward. That is not hypothetical: two pushes a minute apart on
# 2026-10-17 left one deploy permanently red for a reason that had nothing to
# do with either commit.
#
# `cancel-in-progress: false` queues rather than cancels - cancelling a deploy
# part-way through leaves the server branch in a worse state than letting the
# earlier one finish. Queued runs run in the order they were triggered, which
# is the order they were pushed, so the later commit fast-forwards onto the
# earlier one.
concurrency:
  group: deploy-to-dokku
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the frontend *before* the deploy, for two reasons.
      #
      # First, the build is what says what the site is supposed to be serving
      # once the deploy lands - the check below compares the live site
      # against these exact artefacts. Building it here rather than after
      # the deploy also means a commit whose frontend does not build never
      # reaches production at all, instead of reaching it and only then
      # being found broken.
      #
      # Second, this workflow runs on every push to `main` independently of
      # CI's conclusion, so it cannot lean on CI having built anything.
      #
      # The memory cap is the same one CI and the Dockerfile use. The host
      # that builds the image has 3.9 GB of RAM, no swap and nine other
      # applications, and an uncapped build grew until it took that host
      # down - see the Dockerfile for the whole story. Capping it here
      # matters twice over: the build cannot exhaust the host, and the
      # build this step produces is the one the check below compares
      # against.
      - name: Build the frontend
        id: build-frontend
        run: NODE_OPTIONS=--max-old-space-size=1536 pnpm --filter frontend build

      - name: Deploy to Dokku
        # Pinned to the exact commit this workflow has been running, not to a
        # moving branch. This is the one step that receives the production
        # deploy key, on every push to main, so a change on the action's side
        # would otherwise become code execution with the key in hand.
        #
        # a38b28b is dokku/github-action's master as of 2026-08-01. The tagged
        # v1.10.0 is 13 commits behind it, so pinning to the tag would quietly
        # change what runs on the next deploy. Moving to the tag is a separate,
        # deliberate change.
        uses: dokku/github-action@a38b28b1f65617ee2b12e0ca96315fd5f889292f
        with:
          git_remote_url: ${{ secrets.GIT_REMOTE_URL }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          branch: server

      # The deploy step says "the push to Dokku worked". It does not say
      # "the public site is serving this build", and the two come apart:
      # a deploy can fail on the host while the old container keeps
      # answering, so the site is healthy and out of date at the same time.
      # On 2026-10-20 that is exactly what happened - a failed deploy, a
      # healthy site, and the old code still in front of users.
      #
      # So this compares the assets the site serves against the ones this
      # commit's build produced. The asset name is a content hash, so
      # matching names mean matching bytes.
      #
      # It also settles the backend, even though the backend has no
      # artefact of its own to compare: the Dockerfile copies the frontend
      # bundle and the backend sources out of the same build stage into the
      # same image, so a new bundle on the site means a new image, and the
      # new image carries the new backend with it.
      #
      # The address is a repository variable so a fork can point this at its
      # own deployment, and the default keeps the check working without any
      # setup at all - a check that needs a secret to switch itself on is a
      # check that silently does nothing.
      #
      # `always()`, so that it also runs when the deploy step failed: that
      # is exactly when it is worth knowing what the site is serving. A
      # failed deploy on 2026-10-20 left the site healthy on the old
      # build, and nobody could tell that from the run itself. The build
      # step is the one thing it needs, so it is skipped when that failed.
      - name: Confirm the site is serving this build
        if: always() && steps.build-frontend.outcome == 'success'
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://code.aasim.l.cd' }}
        run: node scripts/verify-production-deploy.mjs --site "$PRODUCTION_URL" --dist frontend/dist --timeout 180 --interval 10
