name: Android App

# The APK and the instrumented tests are deliberately not in the push pipeline.
#
# `ci.yml`'s Android job runs `--settings-file settings-proxy-only.gradle.kts`,
# which excludes `:app` so that no push has to download an Android SDK. That is
# the right trade for the proxy, which is a plain JVM module and can be proven
# on a bare JDK - but it means `:app` is built and tested by hand, locally,
# and "the APK is fine" is a claim nobody but a person on a machine can make.
#
# So `:app` gets its own workflow, and it runs on a schedule and on demand
# rather than on every push. The SDK and the emulator are a multi-gigabyte
# download; paying that on every push would mean running these rarely or not
# at all, which is the state this is meant to leave.

on:
  schedule:
    # Off the hour, and not on the hour: every scheduled workflow on the
    # planet fires at :00, and the queue at that minute is the slowest one
    # there is.
    - cron: '37 4 * * *'
  workflow_dispatch:

# Two runs at once would fight over the Gradle cache and over the runner's
# KVM device, and neither of them would be worth the trouble. A scheduled run
# that arrives while a manual one is in flight waits for it.
concurrency:
  group: android-app
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build the APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 17, the same version the `android-proxy` job uses, and for the
          # same reason: `android/proxy/build.gradle.kts` pins
          # `jvmToolchain(17)`, and `:app` depends on `:proxy`, so the
          # toolchain has to be findable whichever job builds it. AGP 8.7
          # accepts 17, so one JDK serves as the launcher and as the
          # toolchain.
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3

      - name: Accept the SDK licences
        # `sdkmanager --licenses` reads from stdin, and a licence it has not
        # been given makes every later SDK download fail with a message that
        # says nothing about licences.
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Build the debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug

      # The APK is the artefact; a build that says BUILD SUCCESSFUL and
      # produces no file is the failure mode worth catching.
      - name: Confirm the APK exists
        working-directory: android
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          if [ ! -f "$APK" ]; then
            echo "$APK was not produced"
            exit 1
          fi
          ls -l "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  instrumented-tests:
    name: Instrumented tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 17, for the same reason as the build job: `:app` depends on
          # `:proxy`, and the proxy pins `jvmToolchain(17)`.
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3

      - name: Accept the SDK licences
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install the emulator and the system image
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "emulator" "system-images;android-34;google_apis;x86_64"

      # The emulator is a virtualised device: without KVM it either refuses to
      # start or falls back to software, which is too slow to finish a test
      # run. The runner has nested virtualisation; it is the permissions on
      # the device node that are missing by default.
      - name: Give the runner access to KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Start the emulator
        run: |
          $ANDROID_HOME/emulator/emulator \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -no-accel -enable-hw-keyboard \
            -qemu -m 2048M -camera-back none -camera-front none -wipe-data \
            > /tmp/emulator.log 2>&1 &

          # `adb wait-for-device` returns as soon as the device is visible to
          # adb, which is *before* the system has finished booting. Gradle
          # would then install the APK onto a half-booted system and fail in
          # a way that says nothing about the test. So wait for the property
          # that means "booted", not for the device to appear.
          adb wait-for-device
          for attempt in $(seq 1 60); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              echo "the emulator finished booting"
              exit 0
            fi
            sleep 5
          done
          echo "the emulator did not finish booting in time" >&2
          tail -50 /tmp/emulator.log >&2 || true
          exit 1

      - name: Run the instrumented tests
        working-directory: android
        run: ./gradlew :app:connectedDebugAndroidTest

      # A green run that executed zero tests is the failure mode this
      # repository has already been bitten by once, on the Electron job. The
      # XML report is the only place the real count is recorded, so it is the
      # only thing worth asserting on.
      - name: Confirm the tests actually ran
        working-directory: android
        run: |
          RESULTS=app/build/outputs/androidTest-results/connected
          if [ ! -d "$RESULTS" ]; then
            echo "no instrumented test results were produced, so nothing was actually verified"
            exit 1
          fi
          # The reports are one directory deeper than this - `connected/debug/` -
          # because the reports are grouped by the device they ran on. A glob
          # that misses them finds nothing, and "found nothing" would read as
          # "ran zero tests", which is the same conclusion for a different
          # reason. So the files are found rather than assumed.
          #
          # `-print0` and `xargs -0` because the report's file name carries
          # the device's name, and a device name has spaces in it. A plain
          # `xargs` splits on that space and hands grep half a file name.
          COUNT=$(find "$RESULTS" -name '*.xml' -type f -print0 \
            | xargs -0 grep -ho 'tests="[0-9]*"' \
            | grep -o '[0-9]\+' \
            | awk '{ total += $1 } END { print total + 0 }')
          echo "tests executed: $COUNT"
          case "$COUNT" in
            ''|*[!0-9]*)
              echo "could not read a test count out of $RESULTS"
              exit 1
              ;;
          esac
          if [ "$COUNT" -lt 4 ]; then
            echo "expected the instrumented suite to run at least 4 tests; $COUNT is too few to be the real suite"
            exit 1
          fi
