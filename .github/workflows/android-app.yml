name: Android App

# The APK and the instrumented tests are deliberately not in the push pipeline.
#
# `ci.yml`'s Android job runs `--settings-file settings-proxy-only.gradle.kts`,
# which excludes `:app` so that no push has to download an Android SDK. That is
# the right trade for the proxy, which is a plain JVM module and can be proven
# on a bare JDK - but it means `:app` is built and tested by hand, locally,
# and "the APK is fine" is a claim nobody but a person on a machine can make.
#
# So `:app` gets its own workflow, and it runs on a schedule and on demand
# rather than on every push. The SDK and the emulator are a multi-gigabyte
# download; paying that on every push would mean running these rarely or not
# at all, which is the state this is meant to leave.

on:
  schedule:
    # Off the hour, and not on the hour: every scheduled workflow on the
    # planet fires at :00, and the queue at that minute is the slowest one
    # there is.
    - cron: '37 4 * * *'
  workflow_dispatch:

# Two runs at once would fight over the Gradle cache and over the runner's
# KVM device, and neither of them would be worth the trouble. A scheduled run
# that arrives while a manual one is in flight waits for it.
concurrency:
  group: android-app
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build the APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 17, the same version the `android-proxy` job uses, and for the
          # same reason: `android/proxy/build.gradle.kts` pins
          # `jvmToolchain(17)`, and `:app` depends on `:proxy`, so the
          # toolchain has to be findable whichever job builds it. AGP 8.7
          # accepts 17, so one JDK serves as the launcher and as the
          # toolchain.
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v4
        with:
          # `tools` is gone from Google's repository.
          #
          # The v3 default asked for it, `sdkmanager` answered "Failed to find
          # package 'tools'", and the step failed - so the run failed, every
          # day, before a single line of the project had been built. That is
          # what this workflow did from the day it was added; it had never
          # once reached the build.
          #
          # v4 does not ask for it. Saying it out loud here means a future
          # default cannot quietly put it back either.
          packages: "platform-tools"

      - name: Accept the SDK licences
        # `sdkmanager --licenses` reads from stdin, and a licence it has not
        # been given makes every later SDK download fail with a message that
        # says nothing about licences.
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install the platform the app compiles against
        # `compileSdk` is 35 and AGP 8.7 wants build-tools 35.0.0. AGP would
        # fetch both by itself, but a build that stops to download its own
        # toolchain is a build whose failure message is about the network
        # rather than about the project. Naming them says what the build
        # needs, and a missing one fails here with a name in it.
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build the debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug

      # The APK is the artefact; a build that says BUILD SUCCESSFUL and
      # produces no file is the failure mode worth catching.
      - name: Confirm the APK exists
        working-directory: android
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          if [ ! -f "$APK" ]; then
            echo "$APK was not produced"
            exit 1
          fi
          ls -l "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  instrumented-tests:
    name: Instrumented tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 17, for the same reason as the build job: `:app` depends on
          # `:proxy`, and the proxy pins `jvmToolchain(17)`.
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v4
        with:
          # The same reason as in the build job, and the same words: `tools` is
          # gone from Google's repository and v3 still asked for it.
          packages: "platform-tools"

      - name: Accept the SDK licences
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install the emulator and the system image
        # `platforms;android-35` and `build-tools;35.0.0` are here because the
        # instrumented run builds the app before it installs it, and the app
        # compiles against 35. The emulator itself runs API 34, which is above
        # the app's `minSdk` of 26, so the device can run what is built.
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "platforms;android-34" "build-tools;35.0.0" "emulator" "system-images;android-34;google_apis;x86_64"

      # The emulator is a virtualised device: without KVM it either refuses to
      # start or falls back to software, which is too slow to finish a test
      # run. The runner has nested virtualisation; it is the permissions on
      # the device node that are missing by default.
      - name: Give the runner access to KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # The emulator needs a device to run, and `avdmanager` is the only way
      # to make one. Without it the emulator starts, finds nothing to run, and
      # exits at once - which is what this workflow did: `adb wait-for-device`
      # then waited for a device that was never coming, until the job ran out
      # of time and said nothing about why.
      - name: Create the device the tests run on
        run: |
          # `avdmanager` asks whether it should build a custom hardware
          # profile; the answer is no, because the default one is what the
          # tests need and a custom one is one more thing to go wrong.
          echo no | avdmanager create avd \
            --force \
            --name opencode \
            --package "system-images;android-34;google_apis;x86_64" \
            --abi x86_64 \
            --device "pixel_6"
          avdmanager list avd

      # Every flag here is one the emulator still knows. It used to be handed
      # `-enable-hw-keyboard`, and that option is gone: the emulator said
      # "unknown option" and exited, which is a good way to fail - the
      # hardware keyboard is on by default anyway, and the flag was only
      # ever about the on-screen one.
      #
      # There is no acceleration flag either. The default is "use KVM if the
      # machine has it", and the step above gives this runner KVM on
      # purpose. Asking for it explicitly would only make a runner without
      # it fail here instead of booting slowly.
      #
      # `setsid` because the emulator is a *background* process and the step
      # has to be able to end: without it the runner waits for the emulator to
      # exit, and the emulator never does.
      - name: Start the emulator
        run: |
          $ANDROID_HOME/emulator/emulator -version
          setsid $ANDROID_HOME/emulator/emulator \
            -avd opencode \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect \
            -camera-back none -camera-front none -wipe-data \
            > /tmp/emulator.log 2>&1 &

          # `adb wait-for-device` returns as soon as the device is visible to
          # adb, which is *before* the system has finished booting. Gradle
          # would then install the APK onto a half-booted system and fail in
          # a way that says nothing about the test. So wait for the property
          # that means "booted", not for the device to appear.
          #
          # Both waits are bounded, and both say what went wrong: a device
          # that never arrives must fail here, with the emulator's own log
          # beside it, rather than hang until the job times out.
          timeout 120 adb wait-for-device || {
            echo "the device never showed up" >&2
            tail -50 /tmp/emulator.log >&2 || true
            exit 1
          }
          for attempt in $(seq 1 120); do
            if [ "$(timeout 20 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              echo "the emulator finished booting"
              exit 0
            fi
            sleep 5
          done
          echo "the emulator did not finish booting in time" >&2
          tail -50 /tmp/emulator.log >&2 || true
          exit 1

      - name: Run the instrumented tests
        working-directory: android
        run: ./gradlew :app:connectedDebugAndroidTest

      # A green run that executed zero tests is the failure mode this
      # repository has already been bitten by once, on the Electron job. The
      # XML report is the only place the real count is recorded, so it is the
      # only thing worth asserting on.
      - name: Confirm the tests actually ran
        working-directory: android
        run: |
          RESULTS=app/build/outputs/androidTest-results/connected
          if [ ! -d "$RESULTS" ]; then
            echo "no instrumented test results were produced, so nothing was actually verified"
            exit 1
          fi
          # The reports are one directory deeper than this - `connected/debug/` -
          # because the reports are grouped by the device they ran on. A glob
          # that misses them finds nothing, and "found nothing" would read as
          # "ran zero tests", which is the same conclusion for a different
          # reason. So the files are found rather than assumed.
          #
          # `-print0` and `xargs -0` because the report's file name carries
          # the device's name, and a device name has spaces in it. A plain
          # `xargs` splits on that space and hands grep half a file name.
          COUNT=$(find "$RESULTS" -name '*.xml' -type f -print0 \
            | xargs -0 grep -ho 'tests="[0-9]*"' \
            | grep -o '[0-9]\+' \
            | awk '{ total += $1 } END { print total + 0 }')
          echo "tests executed: $COUNT"
          case "$COUNT" in
            ''|*[!0-9]*)
              echo "could not read a test count out of $RESULTS"
              exit 1
              ;;
          esac
          if [ "$COUNT" -lt 4 ]; then
            echo "expected the instrumented suite to run at least 4 tests; $COUNT is too few to be the real suite"
            exit 1
          fi
