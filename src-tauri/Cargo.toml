[package]
name = "opencode-manager"
version = "0.18.0"
description = "OpenCode Manager cross-platform client"
authors = ["CloudyAasim"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "opencode_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
