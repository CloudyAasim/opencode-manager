    <title>OpenCode Manager</title>
    <style>
      html { background: #ffffff; }
      @media (prefers-color-scheme: dark) { html { background: #0a0a0a; } }
      #boot {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        gap: 12px; padding: 12px; box-sizing: border-box;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      #boot .row {
        display: flex; align-items: center; gap: 12px;
        border: 1px solid rgba(128,128,128,0.22); border-radius: 12px; padding: 12px;
      }
      #boot .dot { width: 32px; height: 32px; border-radius: 8px; flex: 0 0 auto; }
      #boot .lines { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
      #boot .bar { height: 12px; border-radius: 6px; }
      @media (prefers-reduced-motion: no-preference) {
        #boot .dot, #boot .bar { background: rgba(128,128,128,0.18); animation: boot-pulse 1.4s ease-in-out infinite; }
        #boot .bar.wide { width: 60%; animation-delay: 0.12s; }
        #boot .bar.narrow { width: 38%; animation-delay: 0.24s; }
        #boot .row:nth-child(2) .bar { animation-delay: 0.06s; }
        #boot .row:nth-child(3) .bar { animation-delay: 0.12s; }
        #boot .row:nth-child(4) .bar { animation-delay: 0.18s; }
        #boot .row:nth-child(5) .bar { animation-delay: 0.24s; }
        @keyframes boot-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
      }
    </style>
    <!--
      Runtime configuration, loaded before the bundle because the bundle reads
      the server base while its modules are still evaluating. A self-hoster
      edits public/config.js (or regenerates it from an environment variable in
      the image) to point this build at their own server, with no rebuild.

      It sits in <head> on purpose. The bundler hoists the module entry into
      <head>, so a script placed in <body> ends up after it in the document and
      this ordering would hold only by accident - correct because module scripts
      are deferred and classic scripts are not, rather than correct because of
      where the lines are. A classic script in <head> runs before parsing
      finishes and therefore before any deferred module, whatever the bundler
      does with the rest.
    -->
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" aria-hidden="true">
      <div class="row"><div class="dot"></div><div class="lines"><div class="bar wide"></div><div class="bar narrow"></div></div></div>
      <div class="row"><div class="dot"></div><div class="lines"><div class="bar wide"></div><div class="bar narrow"></div></div></div>
      <div class="row"><div class="dot"></div><div class="lines"><div class="bar wide"></div><div class="bar narrow"></div></div></div>
      <div class="row"><div class="dot"></div><div class="lines"><div class="bar wide"></div><div class="bar narrow"></div></div></div>
      <div class="row"><div class="dot"></div><div class="lines"><div class="bar wide"></div><div class="bar narrow"></div></div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
